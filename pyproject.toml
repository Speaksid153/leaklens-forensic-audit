[project]
name = "leaklens"
version = "0.1.0"
description = "Evidence-first forensic audits for tabular ML evaluation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

